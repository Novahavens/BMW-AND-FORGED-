<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORGEDSA | Forged Wheel Configurator for BMW M</title>
    <meta name="description" content="Configure FORGEDSA forged wheels on your BMW M in real-time 3D: factory paint, wheel design, size and finish." />
    <meta property="og:title" content="FORGEDSA | Forged Wheel Configurator for BMW M" />
    <meta property="og:description" content="Configure FORGEDSA forged wheels on your BMW M in real-time 3D: factory paint, wheel design, size and finish." />
    <meta property="og:image" content="/brand/icon-512.png" />
    <meta name="theme-color" content="#121212" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/satoshi-900.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // FORGEDSA brand kit: Matte Carbon background, Gunmetal surfaces, Forged Gold primary,
      // Brass Light highlight, Electric Orange used sparingly. `ink` is the main text colour.
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              ink: '#F2EEE6',
              mute: '#9C978E',
              line: 'rgba(255,255,255,0.10)',
              bronze: '#CF9F52',
              gold: '#CF9F52',
              brass: '#E8C37D',
              carbon: '#121212',
              surface: '#1A1A1A',
              gunmetal: '#2A2A2A',
              ember: { DEFAULT: '#FF5A00', light: '#FF7A33' },
              studio: '#121212',
              neon: {
                orange: '#FF5500',
                glow: '#FF6600',
                bright: '#FF3D00',
                soft: '#FF7722',
                dark: '#CC4400'
              },
              vercel: {
                black: '#000000',
                dark: '#080808',
                card: '#0d0d0d',
                hover: '#141414',
                border: 'rgba(255, 255, 255, 0.09)',
                borderHover: 'rgba(255, 255, 255, 0.20)',
                textMuted: '#888888',
                textSecondary: '#A1A1A1',
              }
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              display: ['Satoshi', 'Inter', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            },
            transitionTimingFunction: {
              lux: 'cubic-bezier(0.16, 1, 0.3, 1)'
            },
            boxShadow: {
              panel: '0 0 0 1px rgba(255,255,255,0.06), 0 24px 60px -24px rgba(0,0,0,0.8)',
              float: '0 10px 30px -10px rgba(207,159,82,0.35)',
              ember: '0 10px 30px -10px rgba(255,90,0,0.45)',
              'neon-orange': '0 0 25px rgba(255, 85, 0, 0.35)',
              'neon-orange-sm': '0 0 12px rgba(255, 85, 0, 0.25)',
              'neon-orange-lg': '0 0 45px rgba(255, 85, 0, 0.50)',
              'vercel-card': '0 0 0 1px rgba(255, 255, 255, 0.08), 0 8px 32px -4px rgba(0, 0, 0, 0.7)',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --color-neon-orange: #FF5500;
      }
      @font-face { font-family: 'Satoshi'; src: url('/fonts/satoshi-500.woff2') format('woff2'); font-weight: 500; font-display: swap; }
      @font-face { font-family: 'Satoshi'; src: url('/fonts/satoshi-700.woff2') format('woff2'); font-weight: 700 800; font-display: swap; }
      @font-face { font-family: 'Satoshi'; src: url('/fonts/satoshi-900.woff2') format('woff2'); font-weight: 900; font-display: swap; }
      @font-face {
        font-family: 'Inter';
        src: url('/fonts/inter-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
        font-display: swap;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Inter';
        src: url('/fonts/inter-latin-ext-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
        font-display: swap;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C0, U+2C60-2C7F, U+A720-A7FF;
      }
      html { color-scheme: dark; }
      body {
        margin: 0;
        overflow: hidden;
        font-family: 'Inter', system-ui, sans-serif;
        background-color: #121212;
        color: #F2EEE6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Satoshi for headlines, callouts and the wordmark (brand kit: Black 900 / Bold 700 / Medium 500) */
      .font-display { font-family: 'Satoshi', 'Inter', system-ui, sans-serif; }
      .font-narrow { letter-spacing: -0.01em; }
      /* Dark studio: a soft pool of light under the car on Matte Carbon */
      .bg-studio {
        background:
          radial-gradient(70% 45% at 50% 64%, rgba(207,159,82,0.07) 0%, rgba(207,159,82,0) 60%),
          radial-gradient(120% 85% at 50% 58%, #2c2c2c 0%, #1b1b1b 40%, #121212 70%, #0b0b0b 100%);
      }
      .text-gold-metal {
        background: linear-gradient(180deg, #E8C37D 0%, #CF9F52 55%, #9c7433 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      button, [role="button"] { -webkit-tap-highlight-color: transparent; }
      :focus-visible { outline: 2px solid #CF9F52; outline-offset: 2px; }
      ::selection {
        background-color: #CF9F52;
        color: #121212;
      }
      /* Custom Precision Scrollbars */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.14);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(207,159,82,0.5);
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.985); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-fadeIn {
        animation: fadeIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes riseIn {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-rise { animation: riseIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) both; }
      @keyframes fadeSoft { from { opacity: 0; } to { opacity: 1; } }
      @keyframes stepIn { from { opacity: 0.001; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .animate-step { animation: stepIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .animate-fade { animation: fadeSoft 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; }
      @keyframes slideInRight { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
      .animate-slide-in { animation: slideInRight 0.5s cubic-bezier(0.16, 1, 0.3, 1) both; }
      @keyframes drawLine { from { stroke-dashoffset: var(--len, 1000); } to { stroke-dashoffset: 0; } }
      .animate-draw { stroke-dasharray: var(--len, 1000); animation: drawLine 1.8s cubic-bezier(0.65, 0, 0.35, 1) both; }
      @keyframes giantIn { from { opacity: 0; transform: translateY(4%) scale(0.98); letter-spacing: -0.02em; } to { opacity: 1; transform: none; letter-spacing: -0.045em; } }
      .animate-giant { animation: giantIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .delay-100 { animation-delay: 100ms; } .delay-200 { animation-delay: 200ms; } .delay-300 { animation-delay: 300ms; }
      .delay-500 { animation-delay: 500ms; } .delay-700 { animation-delay: 700ms; }
      @media (prefers-reduced-motion: reduce) {
        .animate-rise, .animate-fade, .animate-slide-in, .animate-draw, .animate-giant { animation-duration: 1ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
