<!doctype html><html><head><style>html,body{margin:0;height:100%;background:var(--bg,radial-gradient(120% 85% at 50% 58%,#2c2c2c 0%,#1b1b1b 40%,#121212 70%,#0b0b0b 100%))}#c{width:100vw;height:100vh}</style></head>
<body><div id="c"></div><script type="module">
import { CarConfiguratorEngine } from '/services/CarConfiguratorEngine.ts';
import { STATIC_CATALOG } from '/services/catalogService.ts';
const q=new URLSearchParams(location.search);
if (q.get('bg')) document.documentElement.style.setProperty('--bg', q.get('bg'));
if (q.get('nosmooth')) CarConfiguratorEngine.SMOOTH_PAINT = false;
if (q.get('hdri')) CarConfiguratorEngine.HDRI_URL = q.get('hdri');
const e=new CarConfiguratorEngine(document.getElementById('c'));
window.e=e;
let car;
if (q.get('model')) {
  car = {
    id: 'adhoc', name: 'Ad-hoc', badge: '', generation: '', chassisCode: '', engine: '', power: '',
    torque: '', acceleration: '', recommendedWheelFitment: { front: '', rear: '', pcd: '', cb: '' },
    bodyStyle: q.get('body') || 'coupe',
    modelUrl: q.get('model'),
    modelRotationDeg: +(q.get('rot') || 0),
    modelLengthM: +(q.get('len') || 4.7),
    paintMeshMatch: q.get('paintMatch') || undefined,
    hideMeshMatch: q.get('hideMatch') || undefined
  };
} else {
  car = STATIC_CATALOG.cars[+(q.get('car')||0)];
}
e.applyPaintColor(STATIC_CATALOG.paints[+(q.get('paint')||0)]);
const wheel = STATIC_CATALOG.wheels[+(q.get('wheel')||0)];
e.applyWheelDesign(wheel);
e.applyWheelFinish(STATIC_CATALOG.finishes[q.get('finish')||'liquid_metal'] || STATIC_CATALOG.finishes.liquid_metal);
e.setRimSize(q.get('size')||'20"');
e.loadCar(car).then(r=>{e.setCameraPreset(q.get('view')||'frontThreeQuarter',{instant:true}); window.done=r; window.mode=r;});
</script></body></html>
