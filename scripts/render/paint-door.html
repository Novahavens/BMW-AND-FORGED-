<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#888"><div id="c"></div>
<script type="module">
// Paint calibration page (scripts/render/paint-calibrate.cjs): the M4 side-on, and door(), which samples
// a fixed patch of the front door right after a render. See docs/bmw-factory-paints.md "Recalibration".
import * as THREE from 'three';
import { CarConfiguratorEngine } from '/services/CarConfiguratorEngine.ts';
import { BMW_MODELS, BMW_PAINTS } from '/data/configuratorData.ts';
import { syncEnvironment } from '/services/carMaterials.ts';
// ?w=&h= set the canvas size (the patch is placed in car space, so it lands on the same spot)
const q = new URLSearchParams(location.search);
const c = document.getElementById('c');
c.style.width = (q.get('w') || 1000) + 'px';
c.style.height = (q.get('h') || 640) + 'px';
const e = new CarConfiguratorEngine(document.getElementById('c'));
window.e = e;
window.paints = BMW_PAINTS;
const car = BMW_MODELS.find((c) => c.id === 'm4_g82');
e.applyPaintColor(BMW_PAINTS[0]);
e.setCameraPreset('side', { instant: true });
e.loadCar(car).then(() => { window.done = true; });
// Mean displayed sRGB of a 24x12 px patch around a car-space point on the front door (below the shoulder line)
window.door = (pt = [0, 0.55, 0.3], w = Math.round(24 * (+(q.get('w') || 1000)) / 1000), h = Math.max(2, Math.round(w / 2))) => {
  e.setCameraPreset('side', { instant: true });
  syncEnvironment(e.scene, e.scene.environment, e.scene.environmentIntensity, e.scene.environmentRotation);
  e.renderer.render(e.scene, e.camera);
  const gl = e.renderer.getContext();
  const W = gl.drawingBufferWidth, H = gl.drawingBufferHeight;
  const v = new THREE.Vector3(...pt).project(e.camera);
  const px = Math.round(((v.x + 1) / 2) * W), py = Math.round(((v.y + 1) / 2) * H);
  const buf = new Uint8Array(w * h * 4);
  gl.readPixels(px - w / 2, py - h / 2, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0; i < buf.length; i += 4) { r += buf[i]; g += buf[i + 1]; b += buf[i + 2]; n++; }
  return { rgb: [r / n, g / n, b / n], px, py: H - py };
};
</script></body></html>
