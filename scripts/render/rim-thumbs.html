<!doctype html><html><head><style>
  .thumb-stage{width:100vw;height:100vh}
  html,body,#root{margin:0;width:100%;height:100%;background:transparent!important}
  /* the viewer's stage, with every control and its backdrop hidden: only the WebGL canvas is left */
  #root *{background:transparent!important;box-shadow:none!important;border:0!important;outline:0!important}
  #root button,#root [role="toolbar"],#root [aria-live],#root p,#root h2,#root span{display:none!important}
</style></head>
<body><div id="root"></div><script type="module" src="/scripts/render/rim-thumbs.ts"></script></body></html>
